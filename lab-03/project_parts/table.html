<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Завдання 1. Таблиця</title>
  </head>
  <body>
    <!-- bgcolor таблиці (чорний) просвічує між комірками: cellspacing="2" дає рамки 2px -->
    <table
      align="center"
      bgcolor="black"
      border="0"
      cellspacing="2"
      cellpadding="0"
    >
      <!-- Рядок 1 -->
      <tr>
        <td colspan="8" bgcolor="#2fffd5" width="480" height="60"></td>
      </tr>
      <!-- Рядок 2 -->
      <tr>
        <td rowspan="6" bgcolor="#fffdd0" width="60" height="360"></td>
        <td colspan="6" bgcolor="#2fffd5" width="360" height="60"></td>
        <td rowspan="6" bgcolor="#fffdd0" width="60" height="360"></td>
      </tr>
      <!-- Рядок 3 -->
      <tr>
        <td rowspan="4" bgcolor="#fffdd0" width="60" height="240"></td>
        <td colspan="4" bgcolor="#2fffd5" width="240" height="60"></td>
        <td rowspan="4" bgcolor="#fffdd0" width="60" height="240"></td>
      </tr>
      <!-- Рядок 4 -->
      <tr>
        <td rowspan="2" bgcolor="#fffdd0" width="60" height="120"></td>
        <td bgcolor="red" width="60" height="60"></td>
        <td bgcolor="blue" width="60" height="60"></td>
        <td rowspan="2" bgcolor="#fffdd0" width="60" height="120"></td>
      </tr>
      <!-- Рядок 5 -->
      <tr>
        <td bgcolor="limegreen" width="60" height="60"></td>
        <td bgcolor="yellow" width="60" height="60"></td>
      </tr>
      <!-- Рядок 6 -->
      <tr>
        <td colspan="4" bgcolor="#2fffd5" width="240" height="60"></td>
      </tr>
      <!-- Рядок 7 -->
      <tr>
        <td colspan="6" bgcolor="#2fffd5" width="360" height="60"></td>
      </tr>
      <!-- Рядок 8 -->
      <tr>
        <td colspan="8" bgcolor="#2fffd5" width="480" height="60"></td>
      </tr>
    </table>

    <p align="center"><a href="../index.html">Повернутись на головну</a></p>
  </body>
</html>
