<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторна робота №6. Завдання 5</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page">
    <div class="weather">
      <!-- чорна картка з температурою -->
      <div class="weather-card">
        <span class="weather-temp">17</span>
        <span class="weather-city">Чернівці · хмарно</span>
      </div>

      <!-- хмара (намальована засобами CSS) -->
      <div class="cloud">
        <div class="cloud-part cloud-part--1"></div>
        <div class="cloud-part cloud-part--2"></div>
        <div class="cloud-part cloud-part--3"></div>
        <div class="cloud-part cloud-part--4"></div>
        <div class="cloud-part cloud-part--5"></div>
      </div>

      <!-- напівпрозорі стрілки -->
      <div class="weather-arrows">
        <a class="arrow arrow--prev" href="#prev" title="Попередній день"
          >&larr;</a
        >
        <a class="arrow arrow--next" href="#next" title="Наступний день"
          >&rarr;</a
        >
      </div>

      <!-- прогноз на тиждень -->
      <div class="forecast">
        <div class="forecast-day">
          <span class="forecast-name">Mon</span>
          <span class="forecast-temp">17°</span>
        </div>
        <div class="forecast-day">
          <span class="forecast-name">Tue</span>
          <span class="forecast-temp">19°</span>
        </div>
        <div class="forecast-day">
          <span class="forecast-name">Wed</span>
          <span class="forecast-temp">16°</span>
        </div>
        <div class="forecast-day">
          <span class="forecast-name">Thu</span>
          <span class="forecast-temp">18°</span>
        </div>
        <div class="forecast-day">
          <span class="forecast-name">Fri</span>
          <span class="forecast-temp">21°</span>
        </div>
      </div>
    </div>
  </body>
</html>
